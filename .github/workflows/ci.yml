name: CI

# fmt, clippy and the test suite on every push and pull request (CLAUDE.md, push gate).
# `cargo xtask layers` / `parity` join when the repository has an xtask.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The token only checks out the code.
permissions:
  contents: read

# A newer push to a branch cancels the run it replaces; every commit on main keeps its own run.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    # A pull request from this repository already ran on its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain, with rustfmt and clippy, from rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Install system packages (egui / winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Branches restore main's cache but do not save their own (the 10 GB limit).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      # The UI tests fail on a character no font can draw (docs/testing.md): the Japanese tests need a
      # CJK face. macOS ships Hiragino and Apple Symbols.
      - name: Install system packages and fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            fonts-noto-cjk fonts-dejavu-core
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Branches restore main's cache but do not save their own (the 10 GB limit).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # The version .config/nextest.toml recommends (photocraft's, which has the fix for GHSA-vc25-qg58-w57c).
          tool: cargo-nextest@0.9.150
      - run: cargo nextest run --locked --workspace --profile ci
      # nextest does not run doctests.
      - run: cargo test --locked --doc --workspace

  # Portability (docs/testing.md §4): everything builds on Windows.
  check-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Branches restore main's cache but do not save their own (the 10 GB limit).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --workspace --all-targets
