[package]
name = "pier-engine"
description = "Pier's headless core: folder listing, thumbnails, metadata, Craft App hand-off (no egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
image = { workspace = true }
kamadak-exif = { workspace = true }
photocraft-raw = { workspace = true }

[dev-dependencies]
# Synthetic raw files (DNG / CR2 / RAF / CR3-preview builders) for decode tests.
photocraft-raw = { workspace = true, features = ["testgen"] }
